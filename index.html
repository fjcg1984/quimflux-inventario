<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUIMFLUX Inventario</title>
  <meta name="description" content="Sistema de inventario QUIMFLUX" />
  <link rel="icon" href="assets/quimflux-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img src="assets/quimflux-logo.png" alt="QUIMFLUX"><div><strong>INVENTARIO</strong><span>Control de existencias</span></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">▦ <span>Vista general</span></button>
        <button class="nav-item" data-view="entries">＋ <span>Entradas</span></button>
        <button class="nav-item" data-view="exits">− <span>Salidas</span></button>
        <button class="nav-item" data-view="alerts">⚠ <span>Reposición</span></button>
        <button class="nav-item" data-view="movements">↕ <span>Movimientos</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Sistema conectado</div>
    </aside>

    <main class="main">
      <header class="topbar"><div><p class="eyebrow">GESTIÓN DE INVENTARIO</p><h1 id="page-title">Vista general</h1></div><button class="mobile-menu" id="mobile-menu">☰</button><div class="top-actions"><button class="icon-btn" id="refresh">↻</button><div class="user-pill"><span>F</span><div><b>Administrador</b><small>QUIMFLUX</small></div></div></div></header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="close-modal">×</button><div id="modal-content"></div></div></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
